plugins { id 'com.android.application' }
android {
    namespace 'vn.daodong'
    compileSdk 34
    defaultConfig {
        applicationId 'vn.daodong'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    // Khóa ký cố định (chỉ dùng cài cá nhân) để bản sau cài đè được bản trước
    signingConfigs { debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
